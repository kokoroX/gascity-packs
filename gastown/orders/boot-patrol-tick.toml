[order]
description = "Assign boot's next patrol wisp, or nudge it if it already holds one. The interval is boot's cadence."
# City-scoped: boot is a single city-level named session.
scope = "city"
trigger = "cooldown"
interval = "1h"
exec = "bash $GC_PACK_DIR/assets/scripts/boot-patrol-tick.sh"
timeout = "1m"
