scope = "city"
wake_mode = "fresh"
work_dir = ".gc/agents/deacon"
nudge = "Run 'gc prime' to check patrol status and begin heartbeat cycle."
# The deacon's cadence is the interval of orders/deacon-patrol-tick.toml: the
# order pours and assigns a patrol wisp, triggering a fresh session; the deacon
# burns it and ends its turn. Do not set idle_timeout — the order already paces
# the wake, and a timeout would recycle the idle session for nothing.
max_active_sessions = 1
